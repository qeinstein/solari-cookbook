<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TimeCapsule · Future Tree</title>
<style>
  :root { color-scheme:dark; --bg:#0b1020; --panel:#121a2d; --line:#293451; --muted:#92a0bd; --pass:#45d19a; --fail:#ff6b7a; --accent:#8ca8ff; }
  * { box-sizing:border-box } body { margin:0; background:radial-gradient(circle at 85% -10%,#20366a 0,transparent 38%),var(--bg); color:#eef2ff; font:14px system-ui,sans-serif }
  main { max-width:1180px; margin:auto; padding:42px 28px 70px } header { display:flex; justify-content:space-between; align-items:end; gap:24px; margin-bottom:28px }
  h1 { font-size:32px; letter-spacing:-.04em; margin:0 0 8px } h2 { font-size:17px; margin:0 } p { color:var(--muted); margin:0 }.eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.14em; font-size:11px; font-weight:700 }
  .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:30px }.metric,.panel { border:1px solid var(--line); background:var(--panel); border-radius:14px }.metric { padding:18px }.metric strong { display:block; font-size:26px; margin-top:7px }.fail strong { color:var(--fail) }.pass strong { color:var(--pass) }
  .panel { padding:22px }.panel-head { display:flex; justify-content:space-between; margin-bottom:18px }.tree { display:flex; flex-direction:column; gap:10px }.future { display:grid; grid-template-columns:116px 1fr 90px; gap:16px; align-items:center; padding:15px 16px; border:1px solid var(--line); border-radius:11px; background:#0f1729 }.future-id { font-weight:700 }.future-id small { display:block; color:var(--muted); font-weight:400; margin-top:4px }.events { display:flex; align-items:center; gap:6px; flex-wrap:wrap }.event { padding:6px 9px; border-radius:7px; background:#1a2640; color:#cbd6f4; font-size:12px }.arrow { color:#506080 }.result { text-align:right; font-weight:800; letter-spacing:.08em }.result.PASS { color:var(--pass) }.result.FAIL { color:var(--fail) }.detail { grid-column:2/-1; padding:14px; border-left:3px solid var(--fail); background:#1b1728; border-radius:8px }.detail strong { color:#fff } code { color:#d4dcff }.actions { margin-top:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap }.actions button { border:1px solid var(--line); border-radius:7px; padding:7px 10px; color:#dce4ff; background:#202c49; cursor:pointer }.actions button:disabled { opacity:.6; cursor:wait }.action-result { color:var(--muted); font-size:12px }
  @media (max-width:700px) { main { padding:28px 16px 50px } header { display:block }.summary { grid-template-columns:repeat(2,1fr) }.future { grid-template-columns:1fr; gap:10px }.result { text-align:left }.detail { grid-column:1 } }
</style>
<main>
  <header><div><div class="eyebrow">Temporal reliability workspace</div><h1>Future Tree</h1><p id="run-meta">Loading saved exploration…</p></div><div class="eyebrow">AcmeCloud / collections</div></header>
  <section class="summary"><div class="metric"><div class="eyebrow">Futures explored</div><strong id="explored">—</strong></div><div class="metric fail"><div class="eyebrow">Failures found</div><strong id="failures">—</strong></div><div class="metric pass"><div class="eyebrow">Patched outcome</div><strong id="patched">—</strong></div><div class="metric"><div class="eyebrow">Invariant</div><strong style="font-size:14px;margin-top:14px">stale payment contact</strong></div></section>
  <section class="panel"><div class="panel-head"><div><h2>Explored futures</h2><p>Each row is an isolated timeline from the same starting world.</p></div><div class="eyebrow" id="status">LIVE TRACE</div></div><div class="tree" id="tree"></div></section>
</main>
<script>
  const $ = selector => document.querySelector(selector); const labels = {invoice_created:'invoice created',customer_payment:'customer paid',payment_webhook:'webhook delivered',agent_wakeup:'agent wakeup'};
  async function load() {
    const data = await fetch('/api/run').then(response => response.json()); const futures = data.futures || []; const failures = futures.filter(item => item.status === 'FAIL');
    $('#explored').textContent=futures.length; $('#failures').textContent=failures.length; $('#patched').textContent=failures.length?'PASS':'—'; $('#run-meta').textContent=`${data.run_id || 'saved run'} · ${futures.length} virtual futures · invariant: ${futures[0]?.invariant || '—'}`; $('#status').textContent=`${failures.length} FAILURE${failures.length===1?'':'S'} FOUND`;
    $('#tree').replaceChildren(...futures.map(item => { const row=document.createElement('article'); row.className='future'; const id=document.createElement('div'); id.className='future-id'; id.textContent=item.future_id; const seed=document.createElement('small'); seed.textContent=`seed ${item.seed}`; id.append(seed); const events=document.createElement('div'); events.className='events'; item.events.forEach((event,index)=>{ if(index){const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='→';events.append(arrow)} const chip=document.createElement('span');chip.className='event';chip.textContent=labels[event.kind]||event.kind;events.append(chip)}); const result=document.createElement('div'); result.className=`result ${item.status}`; result.textContent=item.status; row.append(id,events,result); if(item.status==='FAIL'){const detail=document.createElement('div');detail.className='detail';detail.innerHTML=`<strong>Invariant violated:</strong> <code>${item.invariant}</code><br>Agent sent a reminder while payment state was paid but the CRM remained overdue.`;const actions=document.createElement('div');actions.className='actions';const replay=document.createElement('button');replay.textContent='Replay comparison';const minimize=document.createElement('button');minimize.textContent='Minimize future';const output=document.createElement('span');output.className='action-result';replay.onclick=async()=>{replay.disabled=true;output.textContent='Replaying…';const response=await fetch('/api/futures/'+encodeURIComponent(item.future_id)+'/compare',{method:'POST'});const data=await response.json();output.textContent=`Original ${data.comparison.original} · Patched ${data.comparison.patched}`;replay.disabled=false};minimize.onclick=async()=>{minimize.disabled=true;output.textContent='Minimizing…';const response=await fetch('/api/futures/'+encodeURIComponent(item.future_id)+'/minimize',{method:'POST'});const data=await response.json();output.textContent=`${data.events} events · patched ${data.comparison.patched} · saved`;minimize.disabled=false};actions.append(replay,minimize,output);detail.append(actions);row.append(detail)} return row }));
  }
  load().catch(()=>{ $('#status').textContent='TRACE UNAVAILABLE'; $('#tree').textContent='Run an exploration first: python3 main.py local --futures 25'; });
</script>
